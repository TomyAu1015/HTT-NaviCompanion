name: Build Android APK (HTT-NaviCompanion)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Assets from iOS Directory
        run: |
          mkdir -p android/app/src/main/assets
          cp -f KOnNaviCompanion/mascot_assets.dat android/app/src/main/assets/
          cp -f KOnNaviCompanion/voice_assets.dat android/app/src/main/assets/
          ls -lh android/app/src/main/assets/

      - name: Fetch llama.cpp (b5046) Native Source for Android JNI
        working-directory: android/app/src/main/cpp
        run: |
          if [ ! -d "llama.cpp" ]; then
            git clone --depth 1 --branch b5046 https://github.com/ggml-org/llama.cpp.git llama.cpp
          fi

      - name: Fetch Official sherpa-onnx Android AAR (v2.0.2)
        run: |
          mkdir -p android/app/libs
          if [ ! -f android/app/libs/sherpa-onnx-2.0.2.aar ]; then
            curl -fSL -o android/app/libs/sherpa-onnx-2.0.2.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.2/sherpa-onnx-2.0.2.aar
          fi
          ls -lh android/app/libs/

      - name: Generate Release Keystore (v1+v2+v3 Compatible for All Android OEMs)
        working-directory: android
        run: |
          if [ ! -f htt_release.jks ]; then
            keytool -genkeypair -v \
              -keystore htt_release.jks \
              -storepass htt_kon_release_2026 \
              -keypass htt_kon_release_2026 \
              -alias htt_release_key \
              -keyalg RSA \
              -keysize 2048 \
              -storetype JKS \
              -validity 7300 \
              -dname "CN=HTT-NaviCompanion, OU=HoKagoTeaTime, O=HTT, L=Shenzhen, S=Guangdong, C=CN"
          fi
          ls -lh htt_release.jks

      - name: Compute Dynamic Daily Version (Asia/Shanghai)
        run: |
          BUILD_DATE=$(TZ=Asia/Shanghai date +"%d/%m/%Y")
          TODAY_ISO=$(TZ=Asia/Shanghai date +"%Y-%m-%d")
          YMD=$(TZ=Asia/Shanghai date +"%Y%m%d")
          DAILY_SEQ=$(git log --since="${TODAY_ISO} 00:00:00 +0800" --oneline -- android/ .github/workflows/build-apk.yml 2>/dev/null | wc -l | tr -d ' ')
          if [ -z "$DAILY_SEQ" ] || [ "$DAILY_SEQ" -lt 1 ]; then DAILY_SEQ=1; fi
          if [ "$TODAY_ISO" = "2026-11-22" ] && [ "$DAILY_SEQ" -lt 2 ]; then DAILY_SEQ=2; fi
          VER_CODE=$((YMD * 100 + DAILY_SEQ))
          echo "APP_BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV
          echo "APP_DAILY_SEQ=${DAILY_SEQ}" >> $GITHUB_ENV
          echo "APP_VERSION_CODE=${VER_CODE}" >> $GITHUB_ENV
          echo "Android Version: ${DAILY_SEQ}.0 (v${BUILD_DATE}), versionCode=${VER_CODE}"

      - name: Build Signed Release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/htt_release.jks
          KEYSTORE_PASSWORD: htt_kon_release_2026
          KEY_ALIAS: htt_release_key
          KEY_PASSWORD: htt_kon_release_2026
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Verify APK Signature (v1 + v2 + v3)
        working-directory: android
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          ls -lh "$APK_PATH"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"
          else
            jarsigner -verify -verbose "$APK_PATH" | tail -n 15
          fi

      - name: Upload Signed Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HTT-NaviCompanion-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
