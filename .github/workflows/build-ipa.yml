name: Build TrollStore IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build iOS App
        run: |
          xcodebuild clean build \
            -project KOnNaviCompanion.xcodeproj \
            -target KOnNaviCompanion \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT=build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA for TrollStore
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/KOnNaviCompanion.app Payload/
          zip -r -9 KOnNaviCompanion.ipa Payload
          ls -lh KOnNaviCompanion.ipa

      - name: Upload TrollStore IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KOnNaviCompanion-TrollStore
          path: KOnNaviCompanion.ipa
          retention-days: 30
