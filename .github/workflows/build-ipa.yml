name: Build Universal IPA (TrollStore + Sideload + CarPlay + llama.cpp)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'KOnNaviCompanion/**'
      - 'KOnNaviCompanion.xcodeproj/**'
      - 'generate_icons.py'
      - 'download_drive_music.py'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Generate Mugi App Icons
        run: |
          if [ -f "generate_icons.py" ]; then
            python3 -m pip install --quiet --break-system-packages pillow 2>/dev/null || pip3 install --quiet pillow 2>/dev/null || true
            python3 generate_icons.py || true
          fi

      - name: Download and Embed K-ON Music from Google Drive
        run: |
          if [ -f "download_drive_music.py" ]; then
            python3 download_drive_music.py || true
          fi

      - name: Auto-Sync Root Source Uploads Safeguard
        run: |
          for f in AudioPlayerManager.swift CarPlaySceneDelegate.swift ContentView.swift KOnMusicManager.swift KOnLocalLLMManager.swift KOnAIChatSheetView.swift KOnNaviCompanionApp.swift KeyConfig.swift Entitlements.plist Info.plist; do
            if [ -f "$f" ]; then
              echo "Found root $f, syncing to KOnNaviCompanion/..."
              cp -f "$f" "KOnNaviCompanion/"
            fi
          done
          if [ -d "KOnNaviCompanion/KOnNaviCompanion" ]; then
            echo "Detected nested KOnNaviCompanion/KOnNaviCompanion, syncing to main folder..."
            cp -rf KOnNaviCompanion/KOnNaviCompanion/* KOnNaviCompanion/
            rm -rf KOnNaviCompanion/KOnNaviCompanion
          fi

      - name: Build iOS 15-Compatible llama.cpp Static Framework (b5046)
        run: |
          rm -rf build-llama llama-src llama-build
          mkdir -p build-llama/llama.framework/Headers build-llama/llama.framework/Modules
          git clone --depth 1 --branch b5046 https://github.com/ggml-org/llama.cpp.git llama-src
          cmake -S llama-src -B llama-build \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_BLAS=OFF \
            -DGGML_METAL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_CURL=OFF
          cmake --build llama-build --config Release -j4 --target llama
          LIB_FILES=$(find llama-build -name "*.a")
          echo "Merging static libs: $LIB_FILES"
          libtool -static -o build-llama/llama.framework/llama $LIB_FILES
          cp llama-src/include/*.h build-llama/llama.framework/Headers/
          cp llama-src/ggml/include/*.h build-llama/llama.framework/Headers/
          printf 'framework module llama {\n  umbrella header "llama.h"\n  export *\n  module * { export * }\n}\n' > build-llama/llama.framework/Modules/module.modulemap
          ls -lh build-llama/llama.framework/llama

      - name: Build iOS 15-Compatible sherpa-onnx + htt_sherpa Static Framework (v2.0.2)
        run: |
          rm -rf sherpa-src
          git clone --depth 1 --branch v2.0.2 https://github.com/k2-fsa/sherpa-onnx.git sherpa-src
          pushd sherpa-src
          sed -i '' 's/13.0/15.0/g' build-ios.sh 2>/dev/null || true
          bash build-ios.sh
          popd
          # Copy any built ios-arm64 frameworks (excluding simulator) into build-llama/ search path
          find sherpa-src/build-ios -maxdepth 5 -name "*.framework" -path "*ios-arm64*" ! -path "*simulator*" -exec cp -R {} build-llama/ \; || true
          # Build tiny C bridge htt_sherpa.framework (zero struct-version sensitivity)
          mkdir -p build-llama/htt_sherpa.framework/Headers build-llama/htt_sherpa.framework/Modules
          cat << 'EOF' > build-llama/htt_sherpa.framework/Headers/htt_sherpa_bridge.h
          #ifndef HTT_SHERPA_BRIDGE_H
          #define HTT_SHERPA_BRIDGE_H
          #ifdef __cplusplus
          extern "C" {
          #endif
          void* htt_tts_create(const char* model, const char* lexicon, const char* tokens, const char* dict_dir);
          int htt_tts_sample_rate(void* tts);
          int htt_tts_generate_wav(void* tts, const char* text, int sid, float speed, const char* out_wav_path);
          void htt_tts_destroy(void* tts);
          #ifdef __cplusplus
          }
          #endif
          #endif
          EOF
          cat << 'EOF' > /tmp/htt_sherpa_bridge.c
          #include <stdlib.h>
          #include <string.h>
          #include "sherpa-onnx/c-api/c-api.h"
          #include "htt_sherpa_bridge.h"

          void* htt_tts_create(const char* model, const char* lexicon, const char* tokens, const char* dict_dir) {
              SherpaOnnxOfflineTtsConfig cfg;
              memset(&cfg, 0, sizeof(cfg));
              cfg.model.vits.model = model;
              cfg.model.vits.lexicon = (lexicon && lexicon[0]) ? lexicon : "";
              cfg.model.vits.tokens = tokens;
              cfg.model.vits.dict_dir = (dict_dir && dict_dir[0]) ? dict_dir : "";
              cfg.model.vits.noise_scale = 0.667f;
              cfg.model.vits.noise_scale_w = 0.8f;
              cfg.model.vits.length_scale = 1.0f;
              cfg.model.num_threads = 2;
              cfg.model.provider = "cpu";
              cfg.max_num_sentences = 1;
              return (void*)SherpaOnnxCreateOfflineTts(&cfg);
          }

          int htt_tts_sample_rate(void* tts) {
              if (!tts) return 0;
              return SherpaOnnxOfflineTtsSampleRate((const SherpaOnnxOfflineTts*)tts);
          }

          int htt_tts_generate_wav(void* tts, const char* text, int sid, float speed, const char* out_wav_path) {
              if (!tts || !text || !out_wav_path) return 0;
              const SherpaOnnxOfflineTts* handle = (const SherpaOnnxOfflineTts*)tts;
              const SherpaOnnxGeneratedAudio* audio = SherpaOnnxOfflineTtsGenerate(handle, text, sid, speed);
              if (!audio || !audio->samples || audio->n <= 0) {
                  if (audio) SherpaOnnxDestroyOfflineTtsGeneratedAudio(audio);
                  return 0;
              }
              int ok = SherpaOnnxWriteWave(audio->samples, audio->n, audio->sample_rate, out_wav_path);
              SherpaOnnxDestroyOfflineTtsGeneratedAudio(audio);
              return ok ? 1 : 0;
          }

          void htt_tts_destroy(void* tts) {
              if (tts) SherpaOnnxDestroyOfflineTts((const SherpaOnnxOfflineTts*)tts);
          }
          EOF
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=15.0 -O2             -Isherpa-src             -Ibuild-llama/htt_sherpa.framework/Headers             -c /tmp/htt_sherpa_bridge.c -o /tmp/htt_sherpa_bridge.o
          SHERPA_STATIC_LIBS=$(find sherpa-src/build-ios -path "*ios-arm64/*" ! -path "*simulator*" -name "*.a" | tr '\n' ' ')
          echo "Merging sherpa static archives into htt_sherpa.framework: $SHERPA_STATIC_LIBS"
          libtool -static -o build-llama/htt_sherpa.framework/htt_sherpa /tmp/htt_sherpa_bridge.o $SHERPA_STATIC_LIBS
          ls -lh build-llama/htt_sherpa.framework/htt_sherpa
          printf 'framework module htt_sherpa {\n  header "htt_sherpa_bridge.h"\n  export *\n}\n' > build-llama/htt_sherpa.framework/Modules/module.modulemap
          ls -la build-llama/

      - name: Build iOS App (with Native llama.cpp Engine)
        run: |
          LLAMA_DIR="$(pwd)/build-llama"
          SHERPA_FLAGS=""
          for fw in "$LLAMA_DIR"/*.framework; do
            fwname=$(basename "$fw" .framework)
            if [ "$fwname" != "llama" ]; then
              SHERPA_FLAGS="$SHERPA_FLAGS -framework $fwname"
            fi
          done
          echo "Linking frameworks: -framework llama $SHERPA_FLAGS"
          xcodebuild clean build \
            -project KOnNaviCompanion.xcodeproj \
            -target KOnNaviCompanion \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT=build \
            FRAMEWORK_SEARCH_PATHS="$LLAMA_DIR" \
            OTHER_SWIFT_FLAGS="-F $LLAMA_DIR" \
            OTHER_LDFLAGS="-F $LLAMA_DIR -framework llama $SHERPA_FLAGS -framework CoreML -framework Metal -framework MetalKit -framework Accelerate -lc++" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Compile Assets, Copy Resources & Ad-Hoc Sign Universal IPA
        run: |
          mkdir -p build/Release-iphoneos/KOnNaviCompanion.app
          # 1. Compile Assets.car explicitly using xcrun actool
          if [ -d "KOnNaviCompanion/Assets.xcassets" ]; then
            xcrun actool KOnNaviCompanion/Assets.xcassets \
              --compile build/Release-iphoneos/KOnNaviCompanion.app \
              --platform iphoneos \
              --minimum-deployment-target 15.0 \
              --app-icon AppIcon \
              --output-partial-info-plist build/asset-info.plist || true
          fi

          # 2. Copy all root AppIcon and Icon PNG files directly into .app root
          cp KOnNaviCompanion/AppIcon*.png build/Release-iphoneos/KOnNaviCompanion.app/ 2>/dev/null || true
          cp KOnNaviCompanion/Icon*.png build/Release-iphoneos/KOnNaviCompanion.app/ 2>/dev/null || true
          cp KOnNaviCompanion/qr_* build/Release-iphoneos/KOnNaviCompanion.app/ 2>/dev/null || true

          # 2.5 Embed K-ON Music directory into App Bundle for 100% built-in playback
          if [ -d "KOnNaviCompanion/Music" ]; then
            mkdir -p build/Release-iphoneos/KOnNaviCompanion.app/Music
            cp -r KOnNaviCompanion/Music/* build/Release-iphoneos/KOnNaviCompanion.app/Music/ 2>/dev/null || true
            echo "Embedded music files:"
            ls -lh build/Release-iphoneos/KOnNaviCompanion.app/Music | head -n 25 || true
          fi

          # 2.75 Copy any Metal shader/metallib/bundle from llama.framework into .app root if present
          find build-llama -name "*.metallib" -o -name "*.metal" -o -name "*.bundle" | while read -r res; do
            cp -R "$res" build/Release-iphoneos/KOnNaviCompanion.app/ 2>/dev/null || true
          done

          # 2.8 Embed llama.framework into .app/Frameworks if dynamic Mach-O
          if [ -f "build-llama/llama.framework/llama" ] && file "build-llama/llama.framework/llama" | grep -q "dynamically linked"; then
            mkdir -p build/Release-iphoneos/KOnNaviCompanion.app/Frameworks
            cp -R build-llama/llama.framework build/Release-iphoneos/KOnNaviCompanion.app/Frameworks/
            codesign --force --sign - --timestamp=none build/Release-iphoneos/KOnNaviCompanion.app/Frameworks/llama.framework || true
          fi

          # 2.9 Ensure Info.plist always contains CarPlay & Multi-Scene manifest (even if repo Info.plist was stale)
          BUILD_DATE=$(TZ=Asia/Shanghai date +"%d/%m/%Y")
          TODAY_ISO=$(TZ=Asia/Shanghai date +"%Y-%m-%d")
          YMD=$(TZ=Asia/Shanghai date +"%Y%m%d")
          DAILY_SEQ=$(git log --since="${TODAY_ISO} 00:00:00 +0800" --oneline -- KOnNaviCompanion/ KOnNaviCompanion.xcodeproj/ .github/workflows/build-ipa.yml 2>/dev/null | wc -l | tr -d ' ')
          if [ -z "$DAILY_SEQ" ] || [ "$DAILY_SEQ" -lt 1 ]; then DAILY_SEQ=1; fi
          if [ "$TODAY_ISO" = "2026-11-22" ] && [ "$DAILY_SEQ" -lt 2 ]; then DAILY_SEQ=2; fi
          export HTT_BUILD_DATE="$BUILD_DATE" HTT_SHORT_VER="${DAILY_SEQ}.0" HTT_BUNDLE_VER="${YMD}.${DAILY_SEQ}"
          echo "iOS Version: ${HTT_SHORT_VER} (v${HTT_BUILD_DATE}), build=${HTT_BUNDLE_VER}"
          python3 -c 'import os, plistlib; p="build/Release-iphoneos/KOnNaviCompanion.app/Info.plist"; d=plistlib.load(open(p,"rb")); d["HTTBuildDate"]=os.environ["HTT_BUILD_DATE"]; d["CFBundleShortVersionString"]=os.environ["HTT_SHORT_VER"]; d["CFBundleVersion"]=os.environ["HTT_BUNDLE_VER"]; d["UISupportsCarPlay"]=True; d["NSAppTransportSecurity"]={"NSAllowsArbitraryLoads":True}; d["NSMicrophoneUsageDescription"]="用于轻音部 AI 语音录入提问（支持粤语/普通话/多语言，全程在软件内完成）"; d["NSSpeechRecognitionUsageDescription"]="用于将您的语音实时转换为文字发送给轻音部 AI 助手（支持粤语及多语言）"; d["UIApplicationSceneManifest"]={"UIApplicationSupportsMultipleScenes":True,"UISceneConfigurations":{"CPTemplateApplicationSceneSessionRoleApplication":[{"UISceneClassName":"CPTemplateApplicationScene","UISceneConfigurationName":"CarPlayConfiguration","UISceneDelegateClassName":"CarPlaySceneDelegate"}],"CPTemplateApplicationDashboardSceneSessionRoleApplication":[{"UISceneClassName":"CPTemplateApplicationDashboardScene","UISceneConfigurationName":"CarPlayDashboardConfiguration","UISceneDelegateClassName":"CarPlayDashboardSceneDelegate"}],"UIWindowSceneSessionRoleApplication":[{"UISceneClassName":"UIWindowScene","UISceneConfigurationName":"Default Configuration","UISceneDelegateClassName":"PhoneSceneDelegate"}]}}; plistlib.dump(d,open(p,"wb"),fmt=plistlib.FMT_BINARY); print("Injected CarPlay + Multi-Scene manifest into", p)'
          otool -l build/Release-iphoneos/KOnNaviCompanion.app/Frameworks/llama.framework/llama 2>/dev/null | grep -A 5 "LC_BUILD_VERSION\|LC_VERSION_MIN" || true

          # 3. Ad-Hoc sign with entitlements (DO NOT strip binary after codesign, so both TrollStore and Sideloaders get an intact signature!)
          if [ -f "KOnNaviCompanion/Entitlements.plist" ]; then
            codesign --force --sign - --entitlements KOnNaviCompanion/Entitlements.plist --timestamp=none build/Release-iphoneos/KOnNaviCompanion.app
          else
            codesign --force --sign - --timestamp=none build/Release-iphoneos/KOnNaviCompanion.app
          fi
          codesign -dvvv --entitlements - build/Release-iphoneos/KOnNaviCompanion.app || true
          plutil -p build/Release-iphoneos/KOnNaviCompanion.app/Info.plist | grep -E -A 35 "UIApplicationSceneManifest|UISupportsCarPlay" || true

      - name: Package Universal IPA (TrollStore & Sideload Compatible)
        run: |
          rm -rf Payload KOnNaviCompanion.ipa
          mkdir -p Payload
          cp -r build/Release-iphoneos/KOnNaviCompanion.app Payload/

          # Copy iTunesArtwork to IPA root (TrollStore direct fallback)
          cp KOnNaviCompanion/iTunesArtwork . 2>/dev/null || true
          cp KOnNaviCompanion/iTunesArtwork@2x . 2>/dev/null || true

          ls -la Payload/KOnNaviCompanion.app/AppIcon* || true
          ls -la Payload/KOnNaviCompanion.app/Assets.car || true

          # Package single universal IPA (works for TrollStore AND Sideloadly/SideStore/AltStore/Personal Cert)
          zip -r -9 KOnNaviCompanion.ipa Payload iTunesArtwork iTunesArtwork@2x
          ls -lh KOnNaviCompanion.ipa

      - name: Upload Universal IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KOnNaviCompanion-Universal
          path: KOnNaviCompanion.ipa
          retention-days: 30
